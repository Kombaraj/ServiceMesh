apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: go-app
spec:
  hosts:
  - go-app.kombaraj.com
  gateways:
  - go-app
  http:
  - route:
    - destination:
        host: go-app
        subset: canary
        port:
          number: 80
      weight: 40
      headers:
        request:
          set:
            release: canary
    - destination:
        host: go-app
        subset: primary
        port:
          number: 80
      weight: 60
      headers:
        request:
          set:
            release: primary
