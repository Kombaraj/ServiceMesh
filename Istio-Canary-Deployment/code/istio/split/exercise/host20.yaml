apiVersion: v1
kind: Service
metadata:
  name: go-app-primary
  labels:
    app: go-app
    release: primary
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: go-app
    release: primary

---

apiVersion: v1
kind: Service
metadata:
  name: go-app-canary
  labels:
    app: go-app
    release: canary
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: go-app
    release: canary

---

apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: go-app
spec:
  hosts:
  - go-app.kombaraj.com
  gateways:
  - go-app
  http:
  - route:
    - destination:
        host: go-app-canary
        port:
          number: 80
      weight: 20
    - destination:
        host: go-app-primary
        port:
          number: 80
      weight: 80
