apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: go-app
spec:
  hosts:
  - go-app.kombaraj.com
  gateways:
  - go-app
  http:
  - route:
    - destination:
        host: go-app
        subset: canary
        port:
          number: 80
      weight: 20
    - destination:
        host: go-app
        subset: primary
        port:
          number: 80
      weight: 80

---

apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: go-app
spec:
  host: go-app
  subsets:
  - name: primary
    labels:
      release: primary
  - name: canary
    labels:
      release: canary
