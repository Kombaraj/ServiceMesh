apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app-canary
  labels:
    app: go-app
    release: canary
spec:
  selector:
    matchLabels:
      app: go-app
      release: canary
  replicas: 0
  template:
    metadata:
      labels:
        app: go-app
        release: canary
    spec:
      containers:
      - name: go-app
        image: kombaraj/go-app:2.0.0
        imagePullPolicy: IfNotPresent

---

apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: go-app
spec:
  hosts:
  - go-app.kombaraj.com
  gateways:
  - go-app
  http:
  - route:
    - destination:
        host: go-app
        subset: canary
        port:
          number: 80
      weight: 0
      headers:
        request:
          set:
            release: canary
    - destination:
        host: go-app
        subset: primary
        port:
          number: 80
      weight: 100
      headers:
        request:
          set:
            release: primary
